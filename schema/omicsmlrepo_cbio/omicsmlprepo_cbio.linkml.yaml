id: https://w3id.org/omicsmlrepo/omicsmlprepo_cbio
name: omicsmlprepo_cbio
version: 1.0.0
last_updated_on: '2026-07-01'
description: omicsmlprepo_cbio schema for the MetaHarmonizer ecosystem
prefixes:
  linkml: https://w3id.org/linkml/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  EFO: http://www.ebi.ac.uk/efo/EFO_
  HANCESTRO: http://purl.obolibrary.org/obo/HANCESTRO_
  UBERON: http://purl.obolibrary.org/obo/UBERON_
  MRO: http://purl.obolibrary.org/obo/MRO_
  SNOMED: http://purl.bioontology.org/ontology/SNOMEDCT/
default_prefix: omicsmlprepo_cbio
imports:
- linkml:types
classes:
  Omicsmlprepo_cbioRecord:
    description: Main data class for omicsmlprepo_cbio
    slots:
    - age_at_death
    - age_at_diagnosis
    - age_at_metastasis
    - age_at_procurement
    - age_group
    - ancestry
    - ancestry_details
    - body_site
    - cancer_type
    - cancer_type_detailed
    - country
    - curation_id
    - disease_metastasic_site
    - disease_metastasis
    - disease_type
    - histological_subtype
    - location
    - molecular_subtype
    - oncotree_code
    - patientId
    - sample_count
    - sample_type
    - sampleId
    - sex
    - smoker
    - specimen_type
    - study_design
    - studyId
    - target_condition
    - treatment_dose
    - treatment_duration
    - treatment_end
    - treatment_frequency
    - treatment_group
    - treatment_name
    - treatment_notes
    - treatment_number
    - treatment_reason
    - treatment_start
    - treatment_status
    - treatment_type
    - tumor_staging_ajcc
    - tumor_staging_tnm
    - vital_status
slots:
  age_at_death:
    description: The age at which death occurred. Unit is a year.
    range: age_at_death_enum
    pattern: '[0-9]+'
    comments:
    - 'Values should be direct children of: HANCESTRO:0004'
  age_at_diagnosis:
    description: The age of an individual at the time of initial pathologic diagnosis.
    range: float
    pattern: '[0-9]+'
  age_at_metastasis:
    description: Subject's age in years at initial metastasis of cancer
    range: float
    pattern: '[0-9]+'
  age_at_procurement:
    description: Subject's age in years at initial procurement of the sample
    range: float
    required: true
    pattern: '[0-9]+'
  age_group:
    description: 'Age group classification: Newborn (< 1 month/28 days), Infant (>=
      1 month & < 2 yrs), Child (>= 2 yrs & < 11 yrs), Adolescent (>= 11 yrs & < 18
      yrs), Adult (>= 18 yrs & < 65 yrs), Elderly (>= 65 yrs)'
    range: age_group_enum
  ancestry:
    description: Population category defined using ancestry informative markers (AIMs)
      based on genetic/genomic data (children of HANCESTRO:0004)
    range: ancestry_enum
    comments:
    - 'Values should be direct children of: HANCESTRO:0004'
  ancestry_details:
    description: A person's descent or lineage (more specific than 'ancestry'). Patient's
      population ancestry information, inclusive of values relating to racial and
      ethnic groups
    range: ancestry_details_enum
    multivalued: true
    comments:
    - 'Values should be descendants of: HANCESTRO:0004'
  body_site:
    description: Named locations of or within the body. The anatomical location(s)
      affected by the patient's disease/condition/cancer, often the site from which
      the sample was derived
    range: string
    multivalued: true
  cancer_type:
    description: A type(s) of cancer (relevant to the sample) which the patient has
      been diagnosed with
    range: string
    multivalued: true
  cancer_type_detailed:
    description: Detailed information which elaborates on the corresponding curated_cancer_type
      value
    range: string
    multivalued: true
  country:
    description: Country where subject lives and/or data was collected
    range: country_enum
    comments:
    - 'Values should be descendants of: NCIT:C25464'
  curation_id:
    description: Unique identifier
    range: string
    required: true
    identifier: true
  disease_metastasic_site:
    description: .nan
    range: string
  disease_metastasis:
    description: Indicates if the sample is derived from a metastatic lesion
    range: string
  disease_type:
    description: Any abnormal condition of the body or mind that causes discomfort,
      dysfunction, or distress to the person affected or those in contact with the
      person. The disease(s) (relevant to the sample) which the patient has been diagnosed
      with
    range: disease_type_enum
    multivalued: true
    comments:
    - 'Values should be descendants of: NCIT:C7057, EFO_0000408'
  histological_subtype:
    description: .nan
    range: string
  location:
    description: Location (more specific than 'country') where subject lives and/or
      data was collected
    range: string
  molecular_subtype:
    description: .nan
    range: string
  oncotree_code:
    description: A unique identifier assigned to a specific cancer type within the
      open-source OncoTree classification system.
    range: string
  patientId:
    description: Subject identifier
    range: string
    required: true
  sample_count:
    description: The number of samples belong to a given study/dataset
    range: float
    required: true
  sample_type:
    description: Indicates if the sample is derived from a metastatic lesion
    range: string
  sampleId:
    description: Sample identifier
    range: string
    required: true
  sex:
    description: Biological sex of the subject as reported or inferred by sex-specific
      biological traits
    range: string
    required: true
  smoker:
    description: Tobacco smoking behavior.  Assign `Non-smoker (finding)` only when
      the past smoking behavior information is unavailable.
    range: smoker_enum
    multivalued: true
  specimen_type:
    description: The type of a material sample taken from a biological entity for
      testing, diagnostic, propagation, treatment or research purposes. This includes
      particular types of cellular molecules, cells, tissues, organs, body fluids,
      embryos, and body excretory substances. Origin of the specimen, including source
      of the cells, primary/metastatic/recurrent status, and anatomical location of
      derivation
    range: string
    multivalued: true
  study_design:
    description: 'A plan detailing how a study will be performed in order to represent
      the phenomenon under examination, to answer the research questions that have
      been asked, and defining the methods of data analysis. Study design is driven
      by research hypothesis being posed, study subject/population/sample available,
      logistics/resources: technology, support, networking, collaborative support,
      etc.'
    range: string
    multivalued: true
  studyId:
    description: Dataset name
    range: string
    required: true
  target_condition:
    description: The primary phenotype/condition of interest in the study from which
      the sample is derived
    range: target_condition_enum
    required: true
    multivalued: true
    comments:
    - 'Values should be descendants of: NCIT:C7057, EFO_0000408'
  treatment_dose:
    description: A quantity of an agent (such as substance or energy) administered,
      taken, or absorbed at one time. Individual dose amount
    range: float
    multivalued: true
  treatment_duration:
    description: The length of time a treatment session lasts. A session is defined
      as the period of time between when the patient enters the treatment room and
      when they leave it. Overall duration of treatment
    range: float
    multivalued: true
  treatment_end:
    description: Treatment end date/time
    range: string
    multivalued: true
  treatment_frequency:
    description: The number of times a substance is administered within a specific
      time period. Frequency of treatment administration
    range: string
    multivalued: true
  treatment_group:
    description: A study population that receives an intervention(s) within a trial.
      This could include the investigational product(s) or a comparator (e.g., placebo
      or an approved intervention).
    range: string
    multivalued: true
  treatment_name:
    description: The literal identifier of a therapy. Specific name of drug/medication/treatment/surgical
      procedure
    range: string
    multivalued: true
  treatment_notes:
    description: miscellaneous treatment information that does not fit into the other
      categories
    range: string
    multivalued: true
  treatment_number:
    description: number of times individual treatment was administered; can be number
      of doses/cycles/lines
    range: float
    multivalued: true
  treatment_reason:
    description: stated purpose/goal of treatment; can be a specific treatment phase
    range: string
    multivalued: true
  treatment_start:
    description: Treatment start date/time
    range: string
    multivalued: true
  treatment_status:
    description: Information on treatment modifications or scheduling with respect
      to other treatments
    range: string
    multivalued: true
  treatment_type:
    description: Broad treatment category
    range: string
    multivalued: true
  tumor_staging_ajcc:
    description: American Joint Committee on Cancer (tumor staging) (SNOMED:258236004).
      A system to describe the amount and spread of cancer in a patient's body
    range: tumor_staging_ajcc_enum
  tumor_staging_tnm:
    description: Tumor-node-metastasis (TNM) tumor staging system (tumor staging)
      (SNOMED:254293002).A system to describe the amount and spread of cancer in a
      patient's body
    range: string
    pattern: T[X1-4]N[X0-3]M[X0-1]|pTis|Tis
  vital_status:
    description: Indicates whether a person is alive or deceased at a specific point
      in time.
    range: string
enums:
  age_at_death_enum:
    include:
    - reachable_from:
        source_ontology: obo:hancestro
        source_nodes:
        - HANCESTRO:0004
        relationship_types:
        - rdfs:subClassOf
        is_direct: true
  age_group_enum:
    permissible_values:
      Newborn:
        meaning: NCIT:C16731
      Infant:
        meaning: NCIT:C27956
      Child:
        meaning: NCIT:C16423
      Adolescent:
        meaning: NCIT:C27954
      Adult:
        meaning: NCIT:C17600
      Elderly:
        meaning: NCIT:C16268
  ancestry_enum:
    include:
    - reachable_from:
        source_ontology: obo:hancestro
        source_nodes:
        - HANCESTRO:0004
        relationship_types:
        - rdfs:subClassOf
        is_direct: true
  ancestry_details_enum:
    include:
    - reachable_from:
        source_ontology: obo:hancestro
        source_nodes:
        - HANCESTRO:0004
        relationship_types:
        - rdfs:subClassOf
        is_direct: false
  country_enum:
    include:
    - reachable_from:
        source_ontology: obo:ncit
        source_nodes:
        - NCIT:C25464
        relationship_types:
        - rdfs:subClassOf
        is_direct: false
  disease_type_enum:
    include:
    - reachable_from:
        source_ontology: obo:ncit
        source_nodes:
        - NCIT:C7057
        relationship_types:
        - rdfs:subClassOf
        is_direct: false
    - reachable_from:
        source_ontology: obo:efo_0000408
        source_nodes:
        - EFO_0000408
        relationship_types:
        - rdfs:subClassOf
        is_direct: false
  smoker_enum:
    permissible_values:
      Smoker (finding):
        meaning: SNOMED:77176002
      Non-smoker (finding):
        meaning: SNOMED:8392000
      Ex-smoker (finding):
        meaning: SNOMED:8517006
      Never smoked tobacco (finding):
        meaning: SNOMED:266919005
  target_condition_enum:
    include:
    - reachable_from:
        source_ontology: obo:ncit
        source_nodes:
        - NCIT:C7057
        relationship_types:
        - rdfs:subClassOf
        is_direct: false
    - reachable_from:
        source_ontology: obo:efo_0000408
        source_nodes:
        - EFO_0000408
        relationship_types:
        - rdfs:subClassOf
        is_direct: false
  tumor_staging_ajcc_enum:
    permissible_values:
      '0': null
      I: null
      II: null
      III: null
      IV: null
      III/IV: null
